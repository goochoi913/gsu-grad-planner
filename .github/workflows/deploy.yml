name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Registration season (October–January): fresh seat counts from GSU's class search every
  # 30 minutes. :07 and :37 stay clear of the top of the hour, when GitHub delays scheduled runs.
  schedule:
    - cron: '7,37 * * 1,10-12 *'

permissions:
  contents: read

# Let a running publish finish rather than cancelling it mid-push.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 runs src/data/degree.ts directly for the schedule script.
          node-version: 24
          cache: npm

      - run: npm ci

      # The planning logic must still match the original planner's results.
      - name: Check the planning logic
        run: npm test

      # Seat counts, waitlists and any schedule changes, published as live/spring2027.json next to
      # the app (the app loads it at runtime). The app's own files don't change, so the installed
      # PWA doesn't have to update. If GSU's site is down the app keeps the committed schedule.
      - name: Fetch live seat counts from GSU's class search
        run: node scripts/build-schedule.mjs --live || echo "::warning::Class search unavailable — the app keeps the committed schedule"

      - name: Build
        run: npm run build

      # GitHub Pages needs a public repository, and this one is private, so only the built site —
      # the same files a browser downloads, no source, history or notes — goes to the public
      # goochoi913/gsu-grad-planner, which Pages serves at the usual URL. Each publish replaces
      # that repository's single commit, so it stays as small as one copy of the site.
      - name: Publish the built site
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git clone --depth 1 git@github.com:goochoi913/gsu-grad-planner.git site
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. site/
          touch site/.nojekyll
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "The built site is unchanged — nothing to publish."
            exit 0
          fi
          git checkout -q --orphan published
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Built site from ${GITHUB_SHA:0:7}"
          git push -q --force origin published:main
          echo "Published https://goochoi913.github.io/gsu-grad-planner/ — Pages builds it in about a minute."
